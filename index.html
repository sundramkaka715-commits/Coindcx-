<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<link rel="manifest" href="/manifest.json">
<title>CoinDCX Futures Scanner</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js?v=7" defer></script>
</head>
<body>
<header>
  <div>
    <h1>🔥 CoinDCX Futures Scanner</h1>
    <small id="status">Connecting…</small>
  </div>
</header>

<main>
  <section class="controls">
    <select id="resolution">
      <option value="1">1m</option>
      <option value="5" selected>5m</option>
      <option value="60">1h</option>
      <option value="1D">1D</option>
    </select>
    <button id="refresh">Refresh</button>
  </section>

  <section class="divCard"><div class="divTitle"><b>📡 Confirmed RSI Divergence</b><small id="scanStatus">Scan शुरू हो रहा है…</small></div><div id="divergenceList"><div class="none">Scan शुरू हो रहा है…</div></div></section>

  <section class="legend">
    <b>⚡ Live Move</b> = सबसे हाल का real price movement; movement होते ही coin #1. &nbsp;
    <b>% Move</b> = CoinDCX Futures का price-change %. &nbsp;
    <b>DIV</b> = RSI divergence.
  </section>

  <section id="list"></section>

  <section id="chartBox" class="card hidden">
    <div class="chartHead">
      <h2 id="title">Chart</h2>
      <button id="close">×</button>
    </div>
    <div id="signal" class="signal">Loading…</div>
    <canvas id="priceChart"></canvas>
    <canvas id="rsiChart"></canvas>
  </section>
</main>
</body>
</html>
