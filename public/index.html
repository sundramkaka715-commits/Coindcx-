<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoinDCX V18 Strong Confirmation</title><style>body{margin:0;background:#0b1020;color:#eef;font:14px Arial}header{padding:18px;background:#121a31;position:sticky;top:0}.sub{color:#9aa7c7}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 12px;border:1px solid #35466e;border-radius:8px;background:#1b294c;color:#fff}button.on{background:#2d6a4f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:14px}.card{background:#121a31;border:1px solid #29385d;border-radius:12px;padding:14px}.strong{border-color:#f5b642;box-shadow:0 0 18px #f5b64222}.elite{border-color:#ff6b6b}.row{display:flex;justify-content:space-between;margin:7px 0}.score{font-size:28px;font-weight:bold}.tag{padding:4px 7px;border-radius:6px;background:#263354;font-size:11px}.muted{color:#9aa7c7}.empty{text-align:center;padding:35px}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px}.box{background:#10182e;max-width:950px;width:100%;padding:15px;border-radius:14px;max-height:90vh;overflow:auto}.chart{width:100%;height:320px;background:#080d19}.rsi{width:100%;height:120px;background:#080d19}@media(max-width:600px){header{position:relative}.grid{grid-template-columns:1fr}}</style></head><body><header><h2>🚀 CoinDCX Sweep Radar V18</h2><div class="sub">🔥 STRONG CONFIRMED + 🏆 ELITE SETUP</div><div class="bar"><button class="on" data-f="BOTH">Both</button><button data-f="BULLISH">Bullish</button><button data-f="BEARISH">Bearish</button><button onclick="scan()">🔄 Scan Now</button><span id="info" class="sub">Auto 60s</span></div></header><main id="grid" class="grid"><div class="empty">Scanning CoinDCX…</div></main><div id="modal" class="modal"><div class="box"><button onclick="closeM()">✕</button><h3 id="mt"></h3><canvas id="chart" class="chart"></canvas><canvas id="rc" class="rsi"></canvas></div></div><script>let data=[],filter='BOTH';document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()});const n=x=>Number(x).toPrecision(7);async function scan(){document.getElementById('info').textContent='Scanning…';try{data=(await (await fetch('/api/scan')).json()).signals||[];render();document.getElementById('info').textContent='Last scan '+new Date().toLocaleTimeString()}catch(e){document.getElementById('info').textContent='Error '+e.message}}function render(){let a=data.filter(x=>filter==='BOTH'||x.side===filter),g=document.getElementById('grid');if(!a.length){g.innerHTML='<div class="empty">No setup currently. Auto scan continues.</div>';return}g.innerHTML=a.map((x,i)=>`<div class="card ${x.status==='STRONG CONFIRMED'?'strong':''} ${x.quality>=90?'elite':''}"><b>${i+1}. ${x.pair.replace('B-','')}</b> <span class="tag">${x.side}</span> <span class="tag">${x.status}</span><div class="row"><span>Score</span><span class="score">${x.quality}</span></div><div class="row"><span>Entry</span><b>${n(x.entry)}</b></div><div class="row"><span>SL</span>${n(x.sl)}</div><div class="row"><span>T1/T2/T3</span><span>${n(x.t1)} / ${n(x.t2)} / ${n(x.t3)}</span></div><div class="muted">RSI ${x.rsi??'-'} • Volume ${x.volumeRatio}x • Body ${x.body} • Rejection ${x.rejection} • BTC ${x.btc}</div><button onclick="openChart('${x.pair}')">📊 Chart + RSI</button></div>`).join('')}async function openChart(p){document.getElementById('modal').style.display='flex';document.getElementById('mt').textContent=p.replace('B-','')+' — 5M + RSI14';let j=await(await fetch('/api/chart?pair='+encodeURIComponent(p))).json();draw(j.candles||[],j.rsi||[])}function closeM(){document.getElementById('modal').style.display='none'}function draw(c,r){let v=document.getElementById('chart'),x=v.getContext('2d'),w=v.clientWidth,h=v.clientHeight;v.width=w*2;v.height=h*2;x.scale(2,2);if(!c.length)return;let lo=Math.min(...c.map(z=>z.l)),hi=Math.max(...c.map(z=>z.h)),X=i=>20+i/(c.length-1)*(w-40),Y=p=>h-15-(p-lo)/(hi-lo||1)*(h-30);c.forEach((z,i)=>{let q=X(i);x.beginPath();x.moveTo(q,Y(z.h));x.lineTo(q,Y(z.l));x.stroke();x.beginPath();x.moveTo(q,Y(z.o));x.lineTo(q,Y(z.c));x.lineWidth=4;x.stroke()});let rc=document.getElementById('rc'),z=rc.getContext('2d');rc.width=w*2;rc.height=120*2;z.scale(2,2);z.beginPath();r.forEach((q,i)=>{if(q==null)return;let xx=i/(r.length-1)*w,yy=120-q*1.2;i?z.lineTo(xx,yy):z.moveTo(xx,yy)});z.stroke();[30,50,70].forEach(q=>{z.beginPath();z.moveTo(0,120-q*1.2);z.lineTo(w,120-q*1.2);z.stroke()})}scan();setInterval(scan,60000)</script></body></html>
